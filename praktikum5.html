<!DOCTYPE html>
<html lang="id">
<!-- Tag utama HTML dengan bahasa yang digunakan adalah Bahasa Indonesia -->

<head>
    <meta charset="UTF-8">
    <!-- Menentukan karakter encoding menjadi UTF-8 untuk mendukung berbagai karakter -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Membuat halaman web responsif agar menyesuaikan ukuran layar perangkat -->

    <title>Contoh Position CSS</title>
    <!-- Menampilkan judul halaman di tab browser -->

    <link rel="stylesheet" href="praktikum5.css">
    <!-- Menghubungkan file CSS eksternal bernama "praktikum5.css" -->
</head>

<body>
    <div class="container">
        <!-- Container utama yang berisi berbagai contoh box dengan posisi berbeda -->

        <div class="static-box">Static Position</div>
        <!-- Box dengan posisi default (static) -->

        <div class="relative-box">Relative Position (Geser 20px ke kanan, 10px ke bawah)</div>
        <!-- Box dengan posisi relatif terhadap posisi normal -->

        <div class="absolute-box">Absolute Position (Di dalam .container)</div>
        <!-- Box dengan posisi absolut, ditempatkan relatif terhadap container -->

        <div class="sticky-box">Sticky Position (Tetap di atas saat discroll)</div>
        <!-- Box dengan posisi sticky - tetapi di CSS ada kesalahan -->

        <div class="spacer">Scroll ke bawah untuk melihat efek posisi fixed</div>
        <!-- Spacer untuk membuat halaman cukup tinggi agar bisa discroll -->
    </div>

    <div class="fixed-box">Fixed Position (Tetap di pojok bawah kanan)</div>
    <!-- Box yang selalu tetap di pojok kanan bawah saat discroll -->
</body>
</html>
