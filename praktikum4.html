<!DOCTYPE html> 
<html lang="en"> 
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Praktikum CSS Grid</title> 
    <link rel="stylesheet" href="praktikum4.css"> <!-- Menghubungkan file CSS eksternal -->
</head>
<body>

    <!-- Container utama yang akan diatur pakai CSS Grid -->
    <div class="container">
         <!-- Masing-masing div ini adalah item grid -->
         <div class="item">Header</div> <!-- Area header -->
         <div class="item">Sidebar</div> <!-- Area sidebar -->
         <div class="item">Content</div> <!-- Area konten utama -->
         <div class="item"><Footer></Footer></div> <!-- Area footer (seharusnya ini salah, nanti aku kasih catatan di bawah) -->
    </div>

</body>
</html>
