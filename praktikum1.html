<!DOCTYPE html>
<html lang="id"> <!-- Ini memberitahu browser bahwa dokumen ini berbahasa Indonesia -->
    <head>
        <meta charset="UTF-8"> <!-- Mengatur agar teks mendukung semua karakter termasuk simbol dan huruf lokal -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Supaya tampilannya responsif di semua perangkat -->
        <title>Praktikum CSS</title> <!-- Judul yang muncul di tab browser -->
        <link rel="stylesheet" href="praktikum1.css"> <!-- Menghubungkan file CSS eksternal supaya desain tampil -->
    </head>
    <body>
        <h1 id="judul">Belajar CSS Itu Seru!</h1> <!-- Judul utama halaman -->
        <p>CSS bikin tampilan web makin keren dan nggak ngebosenin</p> <!-- Paragraf penjelasan -->

        <div class="card">
            <!-- Ini adalah sebuah kotak (card) dengan style CSS -->
            <p>Ini adalah card dengan style CSS</p>
        </div>

        <button>Klik Aku</button> <!-- Tombol interaktif -->

        <!-- Tambahan elemen kotak warna pink -->
        <div class="box"></div>
    </body>
</html>
