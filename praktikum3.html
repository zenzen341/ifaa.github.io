<!DOCTYPE html>

<html lang="id">
<!-- Elemen root HTML, dengan atribut bahasa "id" (Bahasa Indonesia) -->

<head>
    <meta charset="UTF-8">
    <!-- Mengatur encoding karakter ke UTF-8 agar mendukung semua simbol/karakter -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Membuat tampilan halaman responsif sesuai lebar layar perangkat -->

    <title>Praktikum Flexbox</title>
    <!-- Judul yang ditampilkan di tab browser -->

    <link rel="stylesheet" href="praktikum3.css">
    <!-- Menghubungkan file CSS eksternal bernama "praktikum3.css" -->
</head>

<body>
    <div class="container">
        <!-- Elemen induk (container) yang akan menggunakan Flexbox -->
        
        <div class="item">Item 1</div>
        <!-- Item pertama di dalam flex container -->

        <div class="item">Item 2</div>
        <!-- Item kedua -->

        <div class="item">Item 3</div>
        <!-- Item ketiga -->
    </div>
</body>
</html>
